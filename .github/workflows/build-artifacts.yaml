# Build the full set of release artifacts for every supported OS/arch and
# platform, mirroring what .github/workflows/release.yaml produces:
#   - Fat binaries, archives, and Linux packages (.tar.gz/.zip/.deb/.rpm/.apk)
#   - Windows amd64 installer
#   - Helm charts (coder, provisioner, ai-gateway)
#   - Offline docs tarball
#   - Multi-arch Linux Docker image (pushed to GHCR, no notarization of images)
#
# Optional code signing, enabled only when the matching secrets are present:
#   - GPG:     GPG_RELEASE_KEY_BASE64 (base64 of an UNENCRYPTED private key)
#   - Apple:   AC_CERTIFICATE_P12_BASE64, AC_CERTIFICATE_PASSWORD,
#              AC_APIKEY_ISSUER_ID, AC_APIKEY_ID, AC_APIKEY_P8_BASE64
#              (P12 + App Store Connect API key; enables notarization)
#   - Windows: EV_SIGNING_CERT, EV_KEY, EV_KEYSTORE, EV_TSA_URL,
#              plus variables GCP_CODE_SIGNING_WORKLOAD_ID_PROVIDER and
#              GCP_CODE_SIGNING_SERVICE_ACCOUNT (EV cert in Google Cloud KMS)
#
# Without those secrets the build is unsigned and still succeeds. Note that
# self-provided keys do NOT produce Coder's official signatures: verification
# against release.key in this repo will fail.
#
# Set the workflow_dispatch "publish_docker" input to false to skip pushing the
# Docker image, and "attest" to true to generate an SBOM and attest the image
# (requires GitHub OIDC, which forks may have disabled).
name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      publish_docker:
        description: "Push multi-arch Linux Docker images to GHCR."
        type: boolean
        default: true
      attest_docker:
        description: "Generate an SBOM and attest the Docker image (needs GitHub OIDC)."
        type: boolean
        default: false
      publish_release:
        description: "Create a GitHub Release from the built assets."
        type: boolean
        default: false
  push:
    branches:
      - main
      - "release/*"
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Signing is enabled only when all the secrets for a given signer are
      # present, so this workflow works both on forks (self-provided materials)
      # and in the official repo.
      CODER_SIGN_GPG: ${{ secrets.GPG_RELEASE_KEY_BASE64 != '' && '1' || '0' }}
      CODER_SIGN_DARWIN: ${{ secrets.AC_CERTIFICATE_P12_BASE64 != '' && secrets.AC_CERTIFICATE_PASSWORD != '' && secrets.AC_APIKEY_ISSUER_ID != '' && secrets.AC_APIKEY_ID != '' && secrets.AC_APIKEY_P8_BASE64 != '' && '1' || '0' }}
      CODER_SIGN_WINDOWS: ${{ secrets.EV_SIGNING_CERT != '' && secrets.EV_KEY != '' && secrets.EV_KEYSTORE != '' && secrets.EV_TSA_URL != '' && vars.GCP_CODE_SIGNING_WORKLOAD_ID_PROVIDER != '' && vars.GCP_CODE_SIGNING_SERVICE_ACCOUNT != '' && '1' || '0' }}
      # Docker images are pushed to the owner's own GHCR namespace. Runtime
      # inputs are empty strings on push events, so `!= false` stays true.
      PUBLISH_DOCKER: ${{ inputs.publish_docker != false }}
      ATTEST_DOCKER: ${{ inputs.attest_docker == true }}
      # A GitHub Release is created automatically on v* tag pushes, or manually
      # via the publish_release input on workflow_dispatch.
      PUBLISH_RELEASE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}
      CODER_IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/coder
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    permissions:
      # For actions/checkout and gh release creation.
      contents: write
      # To push Docker images to GHCR.
      packages: write
      # For google-github-actions/auth (Windows EV signing) and cosign keyless
      # attestation. GitHub cannot grant these conditionally.
      id-token: write
      # For actions/attest when attest_docker is enabled.
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/checkout drops annotated tags unless we force-fetch them.
      # This matters on tag pushes, and version.sh handles the no-tags case
      # for forks that never synced tags.
      - name: Fetch git tags
        run: git fetch --tags --force

      - name: Print version
        id: version
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Pin the version so version.sh agrees with Makefile's VERSION even
          # after later steps add commits to the working tree.
          echo "CODER_FORCE_VERSION=$version" >> "$GITHUB_ENV"
          echo "$version"

      - name: Print configuration
        run: |
          echo "version:        ${{ steps.version.outputs.version }}"
          echo "GPG signing:    ${{ env.CODER_SIGN_GPG }}"
          echo "Apple signing:  ${{ env.CODER_SIGN_DARWIN }}"
          echo "Windows signing: ${{ env.CODER_SIGN_WINDOWS }}"
          echo "publish docker: ${{ env.PUBLISH_DOCKER }}"
          echo "attest docker:  ${{ env.ATTEST_DOCKER }}"
          echo "publish release: ${{ env.PUBLISH_RELEASE }}"
          echo "image base:     ${{ env.CODER_IMAGE_BASE }}"

      - name: Set up mise tools
        uses: ./.github/actions/setup-mise
        with:
          install-args: "go node pnpm helm cosign syft"

      # nfpm builds the .apk/.deb/.rpm packages; go-winres embeds Windows
      # icons and version metadata.
      - name: Install Go mise tools
        run: |
          ./.github/scripts/retry.sh -- mise install --locked go:github.com/goreleaser/nfpm/v2/cmd/nfpm
          ./.github/scripts/retry.sh -- mise install --locked go:github.com/tc-hib/go-winres

      - name: Install pnpm dependencies
        uses: ./.github/actions/pnpm-install

      # zstd compresses the slim binaries that fat binaries embed; zip creates
      # the darwin/windows archives; nsis builds the Windows installer.
      - name: Install system packages
        run: sudo apt-get install -y zip zstd nsis

      # Necessary for Apple codesign and notarization.
      - name: Install rcodesign
        if: env.CODER_SIGN_DARWIN == '1'
        run: |
          set -euo pipefail
          ./.github/scripts/retry.sh -- wget -O /tmp/rcodesign.tar.gz https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.22.0/apple-codesign-0.22.0-x86_64-unknown-linux-musl.tar.gz
          sudo tar -xzf /tmp/rcodesign.tar.gz \
            -C /usr/bin \
            --strip-components=1 \
            apple-codesign-0.22.0-x86_64-unknown-linux-musl/rcodesign
          rm /tmp/rcodesign.tar.gz

      - name: Setup Apple Developer certificate and API key
        if: env.CODER_SIGN_DARWIN == '1'
        run: |
          set -euo pipefail
          touch /tmp/{apple_cert.p12,apple_cert_password.txt,apple_apikey.p8}
          chmod 600 /tmp/{apple_cert.p12,apple_cert_password.txt,apple_apikey.p8}
          echo "$AC_CERTIFICATE_P12_BASE64" | base64 -d > /tmp/apple_cert.p12
          echo "$AC_CERTIFICATE_PASSWORD" > /tmp/apple_cert_password.txt
          echo "$AC_APIKEY_P8_BASE64" | base64 -d > /tmp/apple_apikey.p8
        env:
          AC_CERTIFICATE_P12_BASE64: ${{ secrets.AC_CERTIFICATE_P12_BASE64 }}
          AC_CERTIFICATE_PASSWORD: ${{ secrets.AC_CERTIFICATE_PASSWORD }}
          AC_APIKEY_P8_BASE64: ${{ secrets.AC_APIKEY_P8_BASE64 }}

      # Necessary for signing Windows binaries with jsign.
      - name: Setup Java
        if: env.CODER_SIGN_WINDOWS == '1'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "zulu"
          java-version: "11.0"

      - name: Setup Windows EV Signing Certificate
        if: env.CODER_SIGN_WINDOWS == '1'
        run: |
          set -euo pipefail
          touch /tmp/ev_cert.pem
          chmod 600 /tmp/ev_cert.pem
          echo "$EV_SIGNING_CERT" > /tmp/ev_cert.pem
          ./.github/scripts/retry.sh -- wget https://github.com/ebourg/jsign/releases/download/6.0/jsign-6.0.jar -O /tmp/jsign-6.0.jar
        env:
          EV_SIGNING_CERT: ${{ secrets.EV_SIGNING_CERT }}

      # Signing keys live in Google Cloud KMS and are unlocked with a short
      # lived access token obtained through Workload Identity Federation.
      - name: Authenticate to Google Cloud
        id: gcloud_auth
        if: env.CODER_SIGN_WINDOWS == '1'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_CODE_SIGNING_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCP_CODE_SIGNING_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: Setup GCloud SDK
        if: env.CODER_SIGN_WINDOWS == '1'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Login to GHCR
        if: env.PUBLISH_DOCKER == 'true'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Go modules
        run: ./.github/scripts/retry.sh -- go mod download

      # Touch generated files so make does not try to regenerate them and need
      # protoc, sqlc, Postgres, and the other codegen tools.
      - name: Mark generated files fresh
        run: make gen/mark-fresh

      # CODER_SIGN_* are "1" only when the corresponding secrets are present,
      # so signing is skipped automatically otherwise.
      - name: Build binaries, archives, packages, installer, and Helm charts
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh)"
          make -j \
            build/coder_"$version"_linux_{amd64,armv7,arm64}.{tar.gz,apk,deb,rpm} \
            build/coder_"$version"_{darwin,windows}_{amd64,arm64}.zip \
            build/coder_"$version"_windows_amd64_installer.exe \
            build/coder_helm_"$version".tgz \
            build/provisioner_helm_"$version".tgz \
            build/ai-gateway_helm_"$version".tgz
        env:
          CODER_SIGN_GPG: ${{ secrets.GPG_RELEASE_KEY_BASE64 != '' && '1' || '0' }}
          CODER_SIGN_DARWIN: ${{ secrets.AC_CERTIFICATE_P12_BASE64 != '' && secrets.AC_CERTIFICATE_PASSWORD != '' && secrets.AC_APIKEY_ISSUER_ID != '' && secrets.AC_APIKEY_ID != '' && secrets.AC_APIKEY_P8_BASE64 != '' && '1' || '0' }}
          CODER_SIGN_WINDOWS: ${{ secrets.EV_SIGNING_CERT != '' && secrets.EV_KEY != '' && secrets.EV_KEYSTORE != '' && secrets.EV_TSA_URL != '' && vars.GCP_CODE_SIGNING_WORKLOAD_ID_PROVIDER != '' && vars.GCP_CODE_SIGNING_SERVICE_ACCOUNT != '' && '1' || '0' }}
          CODER_WINDOWS_RESOURCES: "1"
          CODER_GPG_RELEASE_KEY_BASE64: ${{ secrets.GPG_RELEASE_KEY_BASE64 }}
          AC_CERTIFICATE_FILE: /tmp/apple_cert.p12
          AC_CERTIFICATE_PASSWORD_FILE: /tmp/apple_cert_password.txt
          AC_APIKEY_ISSUER_ID: ${{ secrets.AC_APIKEY_ISSUER_ID }}
          AC_APIKEY_ID: ${{ secrets.AC_APIKEY_ID }}
          AC_APIKEY_FILE: /tmp/apple_apikey.p8
          EV_KEY: ${{ secrets.EV_KEY }}
          EV_KEYSTORE: ${{ secrets.EV_KEYSTORE }}
          EV_TSA_URL: ${{ secrets.EV_TSA_URL }}
          EV_CERTIFICATE_PATH: /tmp/ev_cert.pem
          GCLOUD_ACCESS_TOKEN: ${{ steps.gcloud_auth.outputs.access_token }}
          JSIGN_PATH: /tmp/jsign-6.0.jar

      - name: Build offline docs
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh)"
          make -j build/coder_docs_"$version".tgz

      - name: Delete Apple Developer certificate and API key
        if: env.CODER_SIGN_DARWIN == '1'
        run: rm -f /tmp/{apple_cert.p12,apple_cert_password.txt,apple_apikey.p8}

      - name: Delete Windows EV Signing Cert
        if: env.CODER_SIGN_WINDOWS == '1'
        run: rm /tmp/ev_cert.pem

      # Builds each arch image from the public coder-base image, then the
      # multi-arch manifest, and pushes everything to CODER_IMAGE_BASE
      # (ghcr.io/<owner>/coder on forks).
      - name: Build and push Linux Docker images
        if: env.PUBLISH_DOCKER == 'true'
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh)"
          make build/coder_"$version"_linux_{amd64,arm64,armv7}.tag
          make push/build/coder_"$version"_linux.tag
          echo "docker image: $(./scripts/image_tag.sh)"

      - name: SBOM generation and attestation
        if: env.ATTEST_DOCKER == 'true'
        continue-on-error: true
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh)"
          image="$(./scripts/image_tag.sh)"
          echo "Generating SBOM for image: ${image}"
          syft "${image}" -o spdx-json > "coder_${version}_sbom.spdx.json"
          echo "Attesting SBOM to image: ${image}"
          cosign clean --force=true "${image}"
          cosign attest --type spdxjson --predicate "coder_${version}_sbom.spdx.json" --yes "${image}"

      - name: GitHub Attestation for binaries
        if: env.ATTEST_DOCKER == 'true'
        continue-on-error: true
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ./build/*.tar.gz
            ./build/*.zip
            ./build/*.deb
            ./build/*.rpm
            ./build/*.apk
            ./build/*_installer.exe

      - name: Generate checksums
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh)"
          pushd build
          sha256sum coder_* | grep -v 'checksums.txt' > "coder_${version}_checksums.txt"
          popd

      - name: Sign checksums file with GPG
        if: env.CODER_SIGN_GPG == '1'
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh)"
          ./scripts/sign_with_gpg.sh "build/coder_${version}_checksums.txt"
        env:
          CODER_GPG_RELEASE_KEY_BASE64: ${{ secrets.GPG_RELEASE_KEY_BASE64 }}

      # Creates a GitHub Release. On a v* tag push the tag already exists and
      # becomes the release name. On workflow_dispatch there is no tag, so the
      # release is named after the version and gh creates the tag.
      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag_name="${{ github.ref_name }}"
            if [[ "$tag_name" != v* ]]; then
              echo "Skipping release: ref is not a version tag."
              exit 0
            fi
          else
            version="$(./scripts/version.sh)"
            tag_name="v${version}"
          fi

          # Never clobber an existing release for the same tag.
          if gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" --json id >/dev/null 2>&1; then
            echo "Release $tag_name already exists, skipping creation."
            exit 0
          fi

          assets=()
          for pattern in \
            ./build/*_installer.exe \
            ./build/*.tar.gz \
            ./build/*.zip \
            ./build/*.tgz \
            ./build/*.apk \
            ./build/*.deb \
            ./build/*.rpm \
            ./build/*_checksums.txt \
            ./build/*_checksums.txt.asc \
            ./coder_*_sbom.spdx.json; do
            for f in $pattern; do
              if [[ -f "$f" ]]; then
                assets+=("$f")
              fi
            done
          done
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No assets found to publish."
            exit 1
          fi

          notes="Automated build of ${tag_name} from commit ${GITHUB_SHA:0:12}."
          echo "Creating release ${tag_name} with ${#assets[@]} assets."
          gh release create "$tag_name" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag_name" \
            --notes "$notes" \
            "${assets[@]}"
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag_name"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coder-build-artifacts
          path: |
            ./build/*_checksums.txt
            ./build/*_checksums.txt.asc
            ./build/*_installer.exe
            ./build/*.tar.gz
            ./build/*.zip
            ./build/*.tgz
            ./build/*.apk
            ./build/*.deb
            ./build/*.rpm
            ./build/coder-slim_*
            ./build/*.asc
            ./coder_*_sbom.spdx.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0